[package]
name = "shasha"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A Git extension for commits that contain their own abbreviated object ID"
license = "MIT"
readme = "README.md"
repository = "https://github.com/jackgraziano/shasha"
homepage = "https://github.com/jackgraziano/shasha"
documentation = "https://docs.rs/shasha"
exclude = ["/.github", "/.shasha", "/AGENTS.md", "/CLAUDE.md"]
keywords = ["git", "commit", "hash", "sha", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "shasha"
path = "src/main.rs"

[[bin]]
name = "git-shasha"
path = "src/bin/git-shasha.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dunce = "1.0"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
sha1 = { version = "0.10", features = ["compress"] }
sha2 = { version = "0.10", features = ["compress"] }
tempfile = "3.20"

[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm-aarch64", "compress"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
